[package]
name = "sdk"
version = "0.1.4"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
url = "2"
runtime = { path = "../runtime" }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
